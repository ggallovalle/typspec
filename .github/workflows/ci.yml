# Environment variables referenced:
#
#   CARGO_REGISTRY_TOKEN  — crates.io API token for publishing
#     Setup: Settings → Secrets and variables → Actions → New repository secret
#     Name:  CARGO_REGISTRY_TOKEN
#     Value: crates.io API token (create at https://crates.io/settings/tokens)
#
#   GITHUB_TOKEN  — auto-provisioned by GitHub, no setup needed
#
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci-test

  build:
    if: startsWith(github.ref, "refs/tags/v")
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          asset="typspec-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czf "../../../../$asset" "typspec${{ matrix.ext }}"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: typspec-${{ matrix.target }}
          path: typspec-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, "refs/tags/v")
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        shell: bash
        run: |
          find artifacts -name "*.tar.gz" -exec mv {} . \;
      - uses: softprops/action-gh-release@v2
        with:
          files: "typspec-*.tar.gz"
          generate_release_notes: true

  publish:
    if: startsWith(github.ref, "refs/tags/v")
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

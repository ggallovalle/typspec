damlev:
    type: misc
    title: Damerau-Levenshtein Distance
    description: >
      String metric for measuring edit distance between two sequences.
      An extension of Levenshtein distance that also considers
      transpositions of two adjacent characters as a single edit.
    url: https://en.wikipedia.org/wiki/Damerau%E2%80%93Levenshtein_distance
    serial-number:
      doi: "10.1145/363347.363387"

fuzzy-matching:
    type: misc
    title: Fuzzy Matching for Spec and Change Names
    description: >
      When a spec or change name doesn't match exactly, typspec uses
      Damerau-Levenshtein distance (@damlev) to find the closest match.
      Names with similarity above approximately 67% are suggested to the
      user as "did you mean" tips. This applies to the status, archive,
      and which commands.
